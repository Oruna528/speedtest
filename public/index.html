<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Pages Speedtest</title>
    <!-- 計測用のコアスクリプト -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 40px 20px; background: #f4f4f7; color: #333; margin: 0; }
        .card { background: white; max-width: 460px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); box-sizing: border-box; }
        
        /* 1. ロゴエリア */
        .logo-container { margin-bottom: 20px; }
        .logo-img { max-width: 180px; height: auto; object-fit: contain; }

        button { background: #ea6000; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-bottom: 25px; }
        button:hover { background: #cc5200; }
        
        /* 2. 識別系情報エリア（ロゴと速度の間） */
        .net-info { font-size: 14px; color: #555; background: #f9f9fb; padding: 15px; border-radius: 12px; margin-bottom: 25px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02); }
        .info-row { display: flex; justify-content: space-between; margin: 8px 0; text-align: left; }
        .info-value { font-weight: 500; color: #333; }

        /* 3. ダウンロード・アップロード速度エリア */
        .speed-container { display: flex; gap: 20px; margin-bottom: 25px; }
        .speed-box { flex: 1; background: #f1f5fd; padding: 15px; border-radius: 12px; border: 1px solid #e1e8f5; }
        .speed-label { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .speed-value { font-size: 26px; font-weight: bold; color: #0051cb; }

        /* 4. 一番下のPingエリア */
        .ping-container { background: #fff; border: 1px solid #eee; padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .ping-label { font-size: 15px; color: #555; font-weight: 500; }
        .ping-value { font-size: 20px; font-weight: bold; color: #222; }
    </style>
</head>
<body>
    <div class="card">
        <!-- 1. ロゴエリア -->
        <div class="logo-container">
            <img src="logo.png" alt="Speedtest Logo" class="logo-img">
        </div>

        <button id="start-btn" onclick="startTest()">テスト開始</button>
        
        <!-- 2. 識別系情報エリア -->
        <div class="net-info">
            <div class="info-row"><span>グローバルIP:</span> <span class="info-value" id="ip">読込中...</span></div>
            <div class="info-row"><span>IP 規格 (IPv):</span> <span class="info-value" id="version">読込中...</span></div>
            <div class="info-row"><span>ネットワーク (ISP):</span> <span class="info-value" id="isp">読込中...</span></div>
            <div class="info-row"><span>測定サーバー位置:</span> <span class="info-value" id="server">読込中...</span></div>
        </div>

        <!-- 3. ダウンロード・アップロード速度エリア -->
        <div class="speed-container">
            <div class="speed-box">
                <div class="speed-label">ダウンロード</div>
                <div class="speed-value" id="download">- <span style="font-size:14px;">Mbps</span></div>
            </div>
            <div class="speed-box">
                <div class="speed-label">アップロード</div>
                <div class="speed-value" id="upload">- <span style="font-size:14px;">Mbps</span></div>
            </div>
        </div>

        <!-- 4. 一番下のPingエリア -->
        <div class="ping-container">
            <span class="ping-label">Ping 応答速度</span>
            <span class="ping-value" id="ping">- ms</span>
        </div>
    </div>

    <script>
        // ページ読み込み時に識別情報を自動取得
        fetch('/api/empty')
            .then(res => res.json())
            .then(data => {
                document.getElementById("ip").textContent = data.ip;
                document.getElementById("version").textContent = data.version;
                document.getElementById("isp").textContent = data.isp;
                document.getElementById("server").textContent = data.server + " (Cloudflare)";
            }).catch(() => {
                document.querySelectorAll(".net-info .info-value").forEach(el => el.textContent = "取得失敗");
            });

        function startTest() {
            const btn = document.getElementById("start-btn");
            btn.disabled = true;
            btn.textContent = "測定中...";

            const s = new Speedtest();
            s.setParameter("url_dl", "/api/download");
            s.setParameter("url_ul", "/api/upload");
            s.setParameter("url_ping", "/api/empty");
            s.setParameter("url_getIp", "/api/empty");

            s.onupdate = function(data) {
                if (data.pingStatus) {
                    document.getElementById("ping").textContent = data.pingStatus + " ms";
                }
                if (data.dlStatus) {
                    document.getElementById("download").innerHTML = data.dlStatus + ' <span style="font-size:14px;">Mbps</span>';
                }
                if (data.ulStatus) {
                    document.getElementById("upload").innerHTML = data.ulStatus + ' <span style="font-size:14px;">Mbps</span>';
                }
            };

            s.onend = function() {
                btn.disabled = false;
                btn.textContent = "テスト開始";
            };

            s.start();
        }
    </script>
</body>
</html>
